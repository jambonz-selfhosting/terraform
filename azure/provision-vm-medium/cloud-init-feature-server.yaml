#cloud-config
# Cloud-init configuration for jambonz Feature Server on Azure

package_update: false
package_upgrade: false

write_files:
  - path: /tmp/jambonz-setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash -xe

      # Variables passed from Terraform
      MYSQL_HOST="${mysql_host}"
      MYSQL_USER="${mysql_user}"
      MYSQL_PASSWORD="${mysql_password}"
      REDIS_HOST="${redis_host}"
      REDIS_PORT="${redis_port}"
      REDIS_PASSWORD="${redis_password}"
      JWT_SECRET="${jwt_secret}"
      WEB_MONITORING_PRIVATE_IP="${web_monitoring_private_ip}"
      VPC_CIDR="${vpc_cidr}"
      URL_PORTAL="${url_portal}"
      KEY_VAULT_NAME="${key_vault_name}"
      RECORDING_WS_BASE_URL="${recording_ws_base_url}"
      KRISP_LICENSE_KEY="${krisp_license_key}"
      ENABLE_OTEL="${enable_otel}"

      echo "Starting jambonz Feature Server configuration for Azure deployment"

      # Set OTEL_ENABLED based on enable_otel parameter
      if [[ "$ENABLE_OTEL" == "true" ]]; then
        OTEL_ENABLED=1
      else
        OTEL_ENABLED=0
      fi

      # Detecting the Linux distribution
      if grep -q 'ID="rhel"' /etc/os-release 2>/dev/null || grep -q 'ID=rhel' /etc/os-release 2>/dev/null; then
          DEFAULT_USER=admin

          echo "Disabling firewalld"
          sudo systemctl stop firewalld || true
          sudo systemctl disable firewalld || true
      else
          DEFAULT_USER=admin
      fi

      # Always use jambonz user for apps
      USER=jambonz
      HOME=/home/jambonz

      # Get instance metadata from Azure IMDS
      echo "Getting instance metadata from Azure IMDS..."
      PUBLIC_IP=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text" 2>/dev/null || curl -s https://api.ipify.org)
      PRIVATE_IP=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/privateIpAddress?api-version=2021-02-01&format=text" 2>/dev/null || hostname -I | awk '{print $1}')
      # Azure IMDS returns an EMPTY STRING (exit 0) for publicIpAddress when the
      # public IP is a separate resource, so the "|| curl ipify" fallback above
      # never fires -- it only catches a curl failure, not an empty answer. That
      # left JAMBONES_API_BASE_URL as "http:///v1" on the v11.1.1 Azure smoke.
      if [ -z "$PUBLIC_IP" ]; then
          PUBLIC_IP=$(curl -s -m 10 https://api.ipify.org)
          echo "IMDS returned no public IP; using $PUBLIC_IP from ipify"
      fi
      INSTANCE_ID=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance/compute/vmId?api-version=2021-02-01&format=text" 2>/dev/null || hostname)

      echo "Public IP: $PUBLIC_IP"
      echo "Private IP: $PRIVATE_IP"
      echo "Instance ID: $INSTANCE_ID"

      echo "Writing $HOME/apps/ecosystem.config.js..."

      cat << EOF > $HOME/apps/ecosystem.config.js
      module.exports = {
      apps : [
      {
          name: 'feature-server',
          cwd: '$HOME/apps/feature-server',
          script: 'app.js',
          instance_var: 'INSTANCE_ID',
          out_file: '$HOME/.pm2/logs/feature-server.log',
          err_file: '$HOME/.pm2/logs/feature-server.log',
          exec_mode: 'fork',
          instances: 'max',
          autorestart: true,
          watch: false,
          max_memory_restart: '5G',
          env: {
            JAMBONES_LOGLEVEL: 'info',
            JAMBONES_TTS_TRIM_SILENCE: 1,
            JWT_SECRET: '$JWT_SECRET',
            JAMBONES_API_BASE_URL: 'http://$URL_PORTAL/v1',
            ENABLE_METRICS: 1,
            STATS_HOST: '127.0.0.1',
            STATS_PORT: 8125,
            STATS_PROTOCOL: 'tcp',
            STATS_TELEGRAF: 1,
            STATS_SAMPLE_RATE: 1,
            JAMBONES_OTEL_ENABLED: $OTEL_ENABLED,
            OTEL_EXPORTER_JAEGER_ENDPOINT: 'http://$WEB_MONITORING_PRIVATE_IP:14268/api/traces',
            OTEL_EXPORTER_OTLP_METRICS_INSECURE: 1,
            OTEL_EXPORTER_JAEGER_GRPC_INSECURE: 1,
            JAMBONES_NETWORK_CIDR: '$VPC_CIDR',
            JAMBONES_MYSQL_HOST: '$MYSQL_HOST',
            JAMBONES_MYSQL_USER: '$MYSQL_USER',
            JAMBONES_MYSQL_PASSWORD: '$MYSQL_PASSWORD',
            JAMBONES_MYSQL_DATABASE: 'jambones',
            JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
            JAMBONES_REDIS_HOST: '$REDIS_HOST',
            JAMBONES_REDIS_PORT: $REDIS_PORT,
            JAMBONES_REDIS_PASSWORD: '$REDIS_PASSWORD',
            ENABLE_JAMBONES_REDIS_TLS: 1,
            JAMBONES_TIME_SERIES_HOST: '$WEB_MONITORING_PRIVATE_IP',
            HTTP_PORT: 3000,
            HTTP_PORT_MAX: 3009,
            DRACHTIO_HOST: '127.0.0.1',
            DRACHTIO_PORT: 9022,
            DRACHTIO_SECRET: 'cymru',
            JAMBONES_FEATURE_SERVERS: '127.0.0.1:9022:cymru',
            // Selects the media server. The old selector picked the drachtio-fsmrf
            // backend and aimed it at what is really a mediajam
            // server: the ESL handshake never completes, feature-server never
            // connects to drachtio, nothing registers, and every call fails 480.
            JAMBONES_MEDIAJAM: '127.0.0.1:8021',
            AUTHENTICATION_KEY: '$JWT_SECRET',
            JAMBONZ_RECORD_WS_USERNAME: 'jambonz',
            JAMBONZ_RECORD_WS_PASSWORD: '$JWT_SECRET',
            JAMBONZ_RECORD_WS_BASE_URL: '$RECORDING_WS_BASE_URL'
          }
        }]
      };
      EOF

      echo "Finished writing config file"

      # Configure the mediajam media server.
      #
      # /etc/default/mediajam ships from the package with the redis vars
      # COMMENTED OUT and a note to supply them at deploy time. mediajam's
      # licensing needs them: without JAMBONES_REDIS_HOST it exits 1 at
      # startup, systemd restarts it forever, feature-server never reaches it
      # on :8021, and every call fails with "no available feature servers" /
      # 480.
      #
      # mediajam takes no MySQL configuration -- only redis (licensing) and
      # silent no-ops.
      #
      # Azure Cache for Redis needs a password and TLS, and the shipped env
      # file has no lines for those at all -- so delete any redis lines and
      # append the full set rather than sed-replacing what may not be there.
      # printf, not a heredoc: this block is indented inside the cloud-init
      # YAML, and a heredoc would write that leading whitespace into the
      # EnvironmentFile (and its terminator would not match at column 0).
      sudo sed -i -e "/^#\?JAMBONES_REDIS_\(HOST\|PORT\|TLS\|USERNAME\|PASSWORD\)=/d" /etc/default/mediajam
      printf 'JAMBONES_REDIS_HOST=%s\nJAMBONES_REDIS_PORT=%s\nJAMBONES_REDIS_PASSWORD=%s\nJAMBONES_REDIS_TLS=1\n' \
        "$REDIS_HOST" "$REDIS_PORT" "$REDIS_PASSWORD" | sudo tee -a /etc/default/mediajam > /dev/null
      if [ -n "$KRISP_LICENSE_KEY" ]; then
          sudo sed -i -e "s|^KRISP_API_KEY=.*|KRISP_API_KEY=$KRISP_LICENSE_KEY|" /etc/default/mediajam
      fi

      sudo systemctl daemon-reload
      # mediajam.service reads /etc/default/mediajam via EnvironmentFile, which
      # is evaluated only when the process starts -- so the edits above take
      # effect only on an explicit restart.
      sudo systemctl restart mediajam

      # Configure telegraf to send to the monitoring server
      echo "JAMBONES_INFLUX_URL=http://$WEB_MONITORING_PRIVATE_IP:8086" | sudo tee -a /etc/default/telegraf > /dev/null
      sudo systemctl restart telegraf

      sudo -u $USER bash -c "pm2 start $HOME/apps/ecosystem.config.js"
      sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
      sudo -u $USER bash -c "pm2 save"
      sudo systemctl enable pm2-$USER.service

      # Set up scheduled events polling for graceful termination
      echo "Setting up Azure Scheduled Events polling for graceful termination..."
      cat << 'SCRIPT' > /usr/local/bin/check-scheduled-events.sh
      #!/bin/bash
      # Poll Azure Scheduled Events for termination notification
      EVENTS=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/scheduledevents?api-version=2020-07-01")
      if echo "$EVENTS" | grep -q '"EventType":"Terminate"'; then
          echo "Termination event detected, initiating graceful shutdown..."
          # Signal jambonz apps to stop accepting new calls
          sudo -u jambonz pm2 sendSignal SIGUSR1 all 2>/dev/null || true
          # Log the event
          echo "$(date): Terminate event received" >> /var/log/jambonz-terminate.log
      fi
      SCRIPT
      chmod +x /usr/local/bin/check-scheduled-events.sh

      # Add cron job to poll every 30 seconds
      echo "* * * * * root /usr/local/bin/check-scheduled-events.sh" >> /etc/crontab
      echo "* * * * * root sleep 30 && /usr/local/bin/check-scheduled-events.sh" >> /etc/crontab

      echo "Feature Server setup complete!"

runcmd:
  - /tmp/jambonz-setup.sh > /var/log/jambonz-setup.log 2>&1

final_message: "jambonz Feature Server cloud-init configuration complete after $UPTIME seconds"
