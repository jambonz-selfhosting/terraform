#cloud-config
# Cloud-init configuration for jambonz Recording Server on Azure

package_update: false
package_upgrade: false

write_files:
  - path: /tmp/jambonz-setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash -e

      # Variables passed from Terraform
      MYSQL_HOST="${mysql_host}"
      MYSQL_USER="${mysql_user}"
      WEB_MONITORING_PRIVATE_IP="${web_monitoring_private_ip}"
      # Secrets are read from Key Vault with this VM's managed identity, not
      # passed in custom_data. The script runs without xtrace (-x) so that no
      # secret is echoed into /var/log/jambonz-setup.log.
      KEY_VAULT_NAME="${key_vault_name}"
      IDENTITY_CLIENT_ID="${identity_client_id}"
      kv_secret() {
        local token value i
        for i in $(seq 1 30); do
          token=$(curl -sf -H Metadata:true --noproxy "*" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net&client_id=$IDENTITY_CLIENT_ID" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])') &&
          value=$(curl -sf -H "Authorization: Bearer $token" \
            "https://$KEY_VAULT_NAME.vault.azure.net/secrets/$1?api-version=7.4" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])') &&
          { printf '%s' "$value"; return 0; }
          sleep 10
        done
        echo "FATAL: could not read secret $1 from Key Vault $KEY_VAULT_NAME" >&2
        return 1
      }
      MYSQL_PASSWORD=$(kv_secret mysql-password)
      JWT_SECRET=$(kv_secret encryption-secret)

      echo "Starting jambonz Recording Server configuration for Azure deployment"

      # Always use jambonz user for apps
      USER=jambonz
      HOME=/home/jambonz

      # Get instance metadata from Azure IMDS
      echo "Getting instance metadata from Azure IMDS..."
      INSTANCE_ID=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance/compute/vmId?api-version=2021-02-01&format=text" 2>/dev/null || hostname)

      echo "Instance ID: $INSTANCE_ID"

      # Configure upload_recordings service
      echo "Configuring upload_recordings service"
      sudo sed -i -e "s/MYSQL_HOST=/MYSQL_HOST=$MYSQL_HOST/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_USER=/MYSQL_USER=$MYSQL_USER/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_PASSWORD=/MYSQL_PASSWORD=$MYSQL_PASSWORD/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_DATABASE=/MYSQL_DATABASE=jambones/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/BASIC_AUTH_USERNAME=/BASIC_AUTH_USERNAME=jambonz/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/BASIC_AUTH_PASSWORD=/BASIC_AUTH_PASSWORD=$JWT_SECRET/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/ENCRYPTION_SECRET=/ENCRYPTION_SECRET=$JWT_SECRET/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/--port 3017/--port 3000/g" /etc/systemd/system/upload_recordings.service

      # Insert the LD_LIBRARY_PATH environment variable into the [Service] section
      sudo sed -i '/\[Service\]/a Environment=LD_LIBRARY_PATH=\/usr\/local\/lib' /etc/systemd/system/upload_recordings.service

      sudo systemctl daemon-reload
      sudo systemctl enable upload_recordings
      sudo systemctl start upload_recordings

      # Configure telegraf to send to the monitoring server
      echo "JAMBONES_INFLUX_URL=http://$WEB_MONITORING_PRIVATE_IP:8086" | sudo tee -a /etc/default/telegraf > /dev/null
      sudo systemctl restart telegraf

      echo "Recording Server setup complete!"

runcmd:
  - /tmp/jambonz-setup.sh > /var/log/jambonz-setup.log 2>&1

final_message: "jambonz Recording Server cloud-init configuration complete after $UPTIME seconds"
