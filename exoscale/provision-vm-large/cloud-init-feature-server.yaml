#cloud-config
# Cloud-init for Jambonz Feature Server on Exoscale (Large deployment)

# Copy SSH keys from default user to jambonz user
bootcmd:
  - |
    set -e
    # Wait for default user home directory
    while [ ! -d /home/debian/.ssh ]; do sleep 1; done
    # Copy SSH keys to jambonz user
    if [ -d /home/debian/.ssh ] && [ -d /home/jambonz ]; then
      cp -r /home/debian/.ssh /home/jambonz/ || true
      chown -R jambonz:jambonz /home/jambonz/.ssh || true
      chmod 700 /home/jambonz/.ssh || true
      chmod 600 /home/jambonz/.ssh/authorized_keys || true
    fi

# Bring up eth1, the Exoscale private network interface.
#
# The `network:` block that used to sit here did NOTHING. cloud-init takes
# network configuration from the DATASOURCE (or /etc/cloud/cloud.cfg.d), not
# from a top-level `network:` key in cloud-config user-data. DataSourceExoscale
# supplies eth0 only, so /etc/netplan/50-cloud-init.yaml was generated with a
# single interface and eth1 stayed DOWN with no address.
#
# The damage was not subtle: with no 172.20.x.x address, redis on the
# web-monitoring host was unreachable, and every host that waits for it sat
# in `until redis-cli ... PING` -- an unbounded loop -- so cloud-init never
# finished. It also silently broke inbound/outbound call classification,
# which relies on feature-server addresses falling inside
# JAMBONES_NETWORK_CIDR.
#
# `netplan set` rather than writing YAML: this sits in an indented block
# scalar, where both a heredoc and printf-with-escapes have already produced
# broken files. netplan lives in /usr/sbin, which is not on every PATH.
  - /usr/sbin/netplan set ethernets.eth1.dhcp4=true
  - /usr/sbin/netplan set ethernets.eth1.optional=true
  - /usr/sbin/netplan apply
  # Wait for the DHCP lease before anything reads the address. drachtio's
  # ExecStartPre resolves LOCAL_IP from eth1 and FALLS BACK TO THE PUBLIC IP
  # when eth1 has none -- which makes its two contact pairs identical and
  # kills it with 'Address already in use', the exact failure the mini had.
  # Seen for real on the first boot of a medium SBC.
  - /bin/bash -c 'for i in $(seq 1 30); do ip -4 addr show eth1 | grep -q "inet " && exit 0; sleep 2; done; echo "WARNING: eth1 has no address after 60s" >&2'

write_files:
  - path: /tmp/configure-feature-server.sh
    permissions: '0755'
    content: |
      #!/bin/bash -xe
      # Configuration script for jambonz Feature Server

      # Variables from Terraform
      MYSQL_HOST="${mysql_host}"
      MYSQL_PORT="${mysql_port}"
      MYSQL_USER="${mysql_user}"
      MYSQL_PASSWORD="${mysql_password}"
      MYSQL_DATABASE="${mysql_database}"
      REDIS_HOST="${redis_host}"
      REDIS_PORT="${redis_port}"
      JWT_SECRET="${jwt_secret}"
      URL_PORTAL="${url_portal}"
      VPC_CIDR="${vpc_cidr}"
      MONITORING_PRIVATE_IP="${monitoring_private_ip}"
      RECORDING_WS_BASE_URL="${recording_ws_base_url}"
      SCALE_IN_TIMEOUT="${scale_in_timeout_seconds}"
      KRISP_LICENSE_KEY="${krisp_license_key}"

      echo "Starting jambonz Feature Server configuration for Exoscale"

      USER=jambonz
      HOME=/home/jambonz

      # Get instance metadata
      echo "Getting instance metadata..."
      # Get private IP from eth1 (private network interface)
      PRIVATE_IP=$(ip -4 addr show eth1 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || echo "172.20.0.1")
      INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || hostname)

      echo "Private IP: $PRIVATE_IP (eth1)"
      echo "Instance ID: $INSTANCE_ID"

      # Wait for databases to be ready
      echo "Waiting for Redis to be ready..."
      until redis-cli -h $REDIS_HOST -p $REDIS_PORT PING &>/dev/null; do
        echo "Redis not ready, waiting..."
        sleep 5
      done

      # Configure the mediajam media server.
      #
      # /etc/default/mediajam ships from the package with the redis vars
      # COMMENTED OUT and a note to supply them at deploy time. mediajam's
      # licensing needs them: without JAMBONES_REDIS_HOST it exits 1 at
      # startup, systemd restarts it forever, feature-server never reaches it
      # on :8021, and every call fails with "no available feature servers" /
      # 480.
      #
      # mediajam takes no MySQL configuration -- only redis (licensing) and
      # Krisp. It replaced FreeSWITCH in v11.0.0, so there is no
      # freeswitch.service on these images: the drop-in this replaced was
      # written into /etc/systemd/system/freeswitch.service.d/, a directory
      # nothing creates, so the write itself failed.
      echo "Configuring mediajam..."
      sed -i -e "s|^#\?JAMBONES_REDIS_HOST=.*|JAMBONES_REDIS_HOST=$REDIS_HOST|" /etc/default/mediajam
      sed -i -e "s|^#\?JAMBONES_REDIS_PORT=.*|JAMBONES_REDIS_PORT=$REDIS_PORT|" /etc/default/mediajam

      if [ -n "$KRISP_LICENSE_KEY" ]; then
          sed -i -e "s|^KRISP_API_KEY=.*|KRISP_API_KEY=$KRISP_LICENSE_KEY|" /etc/default/mediajam
      fi

      systemctl daemon-reload
      # mediajam.service reads /etc/default/mediajam via EnvironmentFile, which
      # is evaluated only when the process starts -- so the edits above take
      # effect only on an explicit restart.
      systemctl restart mediajam

      # Write PM2 ecosystem config
      echo "Writing ecosystem.config.js..."
      cat << 'EOFECO' > $HOME/apps/ecosystem.config.js
      module.exports = {
        apps : [
        {
          name: 'feature-server',
          cwd: '/home/jambonz/apps/feature-server',
          script: 'app.js',
          out_file: '/home/jambonz/.pm2/logs/feature-server.log',
          err_file: '/home/jambonz/.pm2/logs/feature-server.log',
          combine_logs: true,
          autorestart: true,
          watch: false,
          max_memory_restart: '1G',
          env: {
            JAMBONES_LOGLEVEL: 'info',
            JWT_SECRET: 'JWT_SECRET_PLACEHOLDER',
            JAMBONES_API_BASE_URL: 'http://URL_PORTAL_PLACEHOLDER/v1',
            JAMBONES_MYSQL_HOST: 'MYSQL_HOST_PLACEHOLDER',
            JAMBONES_MYSQL_USER: 'MYSQL_USER_PLACEHOLDER',
            JAMBONES_MYSQL_PASSWORD: 'MYSQL_PASSWORD_PLACEHOLDER',
            JAMBONES_MYSQL_DATABASE: 'MYSQL_DATABASE_PLACEHOLDER',
            JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
            JAMBONES_REDIS_HOST: 'REDIS_HOST_PLACEHOLDER',
            JAMBONES_REDIS_PORT: REDIS_PORT_PLACEHOLDER,
            JAMBONES_TIME_SERIES_HOST: 'MONITORING_IP_PLACEHOLDER',
            DRACHTIO_HOST: '127.0.0.1',
            DRACHTIO_PORT: 9022,
            DRACHTIO_SECRET: 'cymru',
            JAMBONES_MEDIAJAM: '127.0.0.1:8021',
            JAMBONES_NETWORK_CIDR: 'VPC_CIDR_PLACEHOLDER',
            ENABLE_METRICS: 1,
            STATS_HOST: '127.0.0.1',
            STATS_PORT: 8125,
            STATS_PROTOCOL: 'tcp',
            STATS_TELEGRAF: 1,
            STATS_SAMPLE_RATE: 1,
            HTTP_PORT: 3000,
            AUTHENTICATION_KEY: 'JWT_SECRET_PLACEHOLDER',
            JAMBONZ_RECORD_WS_USERNAME: 'jambonz',
            JAMBONZ_RECORD_WS_PASSWORD: 'JWT_SECRET_PLACEHOLDER',
            JAMBONZ_RECORD_WS_BASE_URL: 'RECORDING_WS_BASE_URL_PLACEHOLDER'
          }
        }]
      };
      EOFECO

      # Replace placeholders
      sed -i "s/JWT_SECRET_PLACEHOLDER/$JWT_SECRET/g" $HOME/apps/ecosystem.config.js
      sed -i "s/URL_PORTAL_PLACEHOLDER/$URL_PORTAL/g" $HOME/apps/ecosystem.config.js
      sed -i "s/MYSQL_HOST_PLACEHOLDER/$MYSQL_HOST:$MYSQL_PORT/g" $HOME/apps/ecosystem.config.js
      sed -i "s/MYSQL_USER_PLACEHOLDER/$MYSQL_USER/g" $HOME/apps/ecosystem.config.js
      sed -i "s/MYSQL_PASSWORD_PLACEHOLDER/$MYSQL_PASSWORD/g" $HOME/apps/ecosystem.config.js
      sed -i "s/MYSQL_DATABASE_PLACEHOLDER/$MYSQL_DATABASE/g" $HOME/apps/ecosystem.config.js
      sed -i "s/REDIS_HOST_PLACEHOLDER/$REDIS_HOST/g" $HOME/apps/ecosystem.config.js
      sed -i "s/REDIS_PORT_PLACEHOLDER/$REDIS_PORT/g" $HOME/apps/ecosystem.config.js
      sed -i "s|VPC_CIDR_PLACEHOLDER|$VPC_CIDR|g" $HOME/apps/ecosystem.config.js
      sed -i "s/MONITORING_IP_PLACEHOLDER/$MONITORING_PRIVATE_IP/g" $HOME/apps/ecosystem.config.js
      sed -i "s|RECORDING_WS_BASE_URL_PLACEHOLDER|$RECORDING_WS_BASE_URL|g" $HOME/apps/ecosystem.config.js

      # Configure telegraf to send to the monitoring server
      echo "JAMBONES_INFLUX_URL=http://$MONITORING_PRIVATE_IP:8086" | sudo tee -a /etc/default/telegraf > /dev/null
      sudo systemctl restart telegraf

      # Start PM2 apps
      su - $USER -c "pm2 delete all || true"
      su - $USER -c "pm2 start $HOME/apps/ecosystem.config.js"
      su - $USER -c "pm2 save"

      # Set up graceful scale-in script
      echo "Setting up graceful scale-in..."
      cat > $HOME/apps/scripts/drain-feature-server.sh << 'EOFDRAIN'
      #!/bin/bash
      # Graceful scale-in script for feature servers

      REDIS_HOST="REDIS_HOST_PLACEHOLDER"
      REDIS_PORT=REDIS_PORT_PLACEHOLDER
      INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || hostname)
      TIMEOUT=SCALE_IN_TIMEOUT_PLACEHOLDER

      # Check if drain signal exists in Redis
      DRAIN_SIGNAL=$(redis-cli -h $REDIS_HOST -p $REDIS_PORT GET "drain:$INSTANCE_ID" 2>/dev/null)

      if [ "$DRAIN_SIGNAL" == "1" ]; then
        echo "Drain signal detected for $INSTANCE_ID. Initiating graceful shutdown..."

        # Stop accepting new calls (send SIGUSR1 to feature-server)
        pkill -SIGUSR1 -f "feature-server/app.js"

        # Wait for active calls to complete (up to TIMEOUT seconds)
        echo "Waiting up to $TIMEOUT seconds for active calls to complete..."
        sleep $TIMEOUT

        # Terminate the instance via Exoscale API
        echo "Terminating instance $INSTANCE_ID..."
        exoscale compute instance delete $INSTANCE_ID --zone ch-gva-2 --force || true
      fi
      EOFDRAIN

      sed -i "s/REDIS_HOST_PLACEHOLDER/$REDIS_HOST/g" $HOME/apps/scripts/drain-feature-server.sh
      sed -i "s/REDIS_PORT_PLACEHOLDER/$REDIS_PORT/g" $HOME/apps/scripts/drain-feature-server.sh
      sed -i "s/SCALE_IN_TIMEOUT_PLACEHOLDER/$SCALE_IN_TIMEOUT/g" $HOME/apps/scripts/drain-feature-server.sh
      chmod +x $HOME/apps/scripts/drain-feature-server.sh

      # Add cron job to check for drain signal every 30 seconds
      (crontab -u $USER -l 2>/dev/null; echo "* * * * * $HOME/apps/scripts/drain-feature-server.sh") | crontab -u $USER -

      echo "Feature Server configuration complete!"

runcmd:
  - /tmp/configure-feature-server.sh

final_message: "Jambonz Feature Server is ready!"
