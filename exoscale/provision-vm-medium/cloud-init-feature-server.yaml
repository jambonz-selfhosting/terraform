#cloud-config
# Cloud-init for Jambonz Feature Server on Exoscale

# Copy SSH keys from default user to jambonz user
bootcmd:
  - |
    set -e
    # Wait for default user home directory
    while [ ! -d /home/debian/.ssh ]; do sleep 1; done
    # Copy SSH keys to jambonz user
    if [ -d /home/debian/.ssh ] && [ -d /home/jambonz ]; then
      cp -r /home/debian/.ssh /home/jambonz/ || true
      chown -R jambonz:jambonz /home/jambonz/.ssh || true
      chmod 700 /home/jambonz/.ssh || true
      chmod 600 /home/jambonz/.ssh/authorized_keys || true
    fi

# Bring up eth1, the Exoscale private network interface.
#
# The `network:` block that used to sit here did NOTHING. cloud-init takes
# network configuration from the DATASOURCE (or /etc/cloud/cloud.cfg.d), not
# from a top-level `network:` key in cloud-config user-data. DataSourceExoscale
# supplies eth0 only, so /etc/netplan/50-cloud-init.yaml was generated with a
# single interface and eth1 stayed DOWN with no address.
#
# The damage was not subtle: with no 172.20.x.x address, redis on the
# web-monitoring host was unreachable, and every host that waits for it sat
# in `until redis-cli ... PING` -- an unbounded loop -- so cloud-init never
# finished. It also silently broke inbound/outbound call classification,
# which relies on feature-server addresses falling inside
# JAMBONES_NETWORK_CIDR.
#
# `netplan set` rather than writing YAML: this sits in an indented block
# scalar, where both a heredoc and printf-with-escapes have already produced
# broken files. netplan lives in /usr/sbin, which is not on every PATH.
  - /usr/sbin/netplan set ethernets.eth1.dhcp4=true
  - /usr/sbin/netplan set ethernets.eth1.optional=true
  - /usr/sbin/netplan apply
  # Wait for the DHCP lease before anything reads the address. drachtio's
  # ExecStartPre resolves LOCAL_IP from eth1 and FALLS BACK TO THE PUBLIC IP
  # when eth1 has none -- which makes its two contact pairs identical and
  # kills it with 'Address already in use', the exact failure the mini had.
  # Seen for real on the first boot of a medium SBC.
  - /bin/bash -c 'for i in $(seq 1 30); do ip -4 addr show eth1 | grep -q "inet " && exit 0; sleep 2; done; echo "WARNING: eth1 has no address after 60s" >&2'

write_files:
  - path: /tmp/configure-feature-server.sh
    permissions: '0755'
    content: |
      #!/bin/bash -xe
      # Configuration script for jambonz Feature Server

      # Variables from Terraform
      MYSQL_HOST="${mysql_host}"
      MYSQL_PORT="${mysql_port}"
      MYSQL_USER="${mysql_user}"
      MYSQL_PASSWORD="${mysql_password}"
      MYSQL_DATABASE="${mysql_database}"
      REDIS_HOST="${redis_host}"
      REDIS_PORT="${redis_port}"
      JWT_SECRET="${jwt_secret}"
      WEB_MONITORING_PRIVATE_IP="${web_monitoring_private_ip}"
      VPC_CIDR="${vpc_cidr}"
      URL_PORTAL="${url_portal}"
      RECORDING_WS_BASE_URL="${recording_ws_base_url}"
      KRISP_LICENSE_KEY="${krisp_license_key}"

      echo "Starting jambonz Feature Server configuration for Exoscale"

      USER=jambonz
      HOME=/home/jambonz

      # Get instance metadata
      echo "Getting instance metadata..."
      # Get private IP from eth1 (private network interface)
      PRIVATE_IP=$(ip -4 addr show eth1 | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || echo "172.20.0.1")
      INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || hostname)

      echo "Private IP: $PRIVATE_IP (eth1)"
      echo "Instance ID: $INSTANCE_ID"

      # Wait for Redis to be ready
      echo "Waiting for Redis at $REDIS_HOST:$REDIS_PORT..."
      for i in $(seq 1 60); do
          if redis-cli -h $REDIS_HOST -p $REDIS_PORT ping 2>/dev/null | grep -q PONG; then
              echo "Redis is available"
              break
          fi
          echo "Redis not yet available, attempt $i/60..."
          sleep 10
      done

      echo "Writing $HOME/apps/ecosystem.config.js..."

      cat << EOF > $HOME/apps/ecosystem.config.js
      module.exports = {
      apps : [
      {
          name: 'feature-server',
          cwd: '$HOME/apps/feature-server',
          script: 'app.js',
          instance_var: 'INSTANCE_ID',
          out_file: '$HOME/.pm2/logs/feature-server.log',
          err_file: '$HOME/.pm2/logs/feature-server.log',
          exec_mode: 'fork',
          instances: 'max',
          autorestart: true,
          watch: false,
          max_memory_restart: '5G',
          env: {
            JAMBONES_LOGLEVEL: 'info',
            JAMBONES_TTS_TRIM_SILENCE: 1,
            JWT_SECRET: '$JWT_SECRET',
            JAMBONES_API_BASE_URL: 'http://$URL_PORTAL/v1',
            ENABLE_METRICS: 1,
            STATS_HOST: '127.0.0.1',
            STATS_PORT: 8125,
            STATS_PROTOCOL: 'tcp',
            STATS_TELEGRAF: 1,
            STATS_SAMPLE_RATE: 1,
            JAMBONES_OTEL_ENABLED: 1,
            OTEL_EXPORTER_JAEGER_ENDPOINT: 'http://$WEB_MONITORING_PRIVATE_IP:14268/api/traces',
            OTEL_EXPORTER_OTLP_METRICS_INSECURE: 1,
            OTEL_EXPORTER_JAEGER_GRPC_INSECURE: 1,
            JAMBONES_NETWORK_CIDR: '$VPC_CIDR',
            JAMBONES_MYSQL_HOST: '$MYSQL_HOST',
            JAMBONES_MYSQL_PORT: $MYSQL_PORT,
            JAMBONES_MYSQL_USER: '$MYSQL_USER',
            JAMBONES_MYSQL_PASSWORD: '$MYSQL_PASSWORD',
            JAMBONES_MYSQL_DATABASE: '$MYSQL_DATABASE',
            JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
            JAMBONES_REDIS_HOST: '$REDIS_HOST',
            JAMBONES_REDIS_PORT: $REDIS_PORT,

            JAMBONES_TIME_SERIES_HOST: '$WEB_MONITORING_PRIVATE_IP',
            HTTP_PORT: 3000,
            HTTP_PORT_MAX: 3009,
            DRACHTIO_HOST: '127.0.0.1',
            DRACHTIO_PORT: 9022,
            DRACHTIO_SECRET: 'cymru',
            JAMBONES_FEATURE_SERVERS: '127.0.0.1:9022:cymru',
            JAMBONES_MEDIAJAM: '127.0.0.1:8021',
            AUTHENTICATION_KEY: '$JWT_SECRET',
            JAMBONZ_RECORD_WS_USERNAME: 'jambonz',
            JAMBONZ_RECORD_WS_PASSWORD: '$JWT_SECRET',
            JAMBONZ_RECORD_WS_BASE_URL: '$RECORDING_WS_BASE_URL'
          }
        }]
      };
      EOF

      echo "Finished writing config file"

      # Configure the mediajam media server.
      #
      # /etc/default/mediajam ships from the package with the redis vars
      # COMMENTED OUT and a note to supply them at deploy time. mediajam's
      # licensing needs them: without JAMBONES_REDIS_HOST it exits 1 at
      # startup, systemd restarts it forever, feature-server never reaches it
      # on :8021, and every call fails with "no available feature servers" /
      # 480.
      #
      # mediajam takes no MySQL configuration -- only redis (licensing) and
      # Krisp. It replaced FreeSWITCH in v11.0.0, so there is no
      # freeswitch.service on these images and the seds that targeted it were
      # silent no-ops.
      sudo sed -i -e "s|^#\?JAMBONES_REDIS_HOST=.*|JAMBONES_REDIS_HOST=$REDIS_HOST|" /etc/default/mediajam
      sudo sed -i -e "s|^#\?JAMBONES_REDIS_PORT=.*|JAMBONES_REDIS_PORT=$REDIS_PORT|" /etc/default/mediajam
      if [ -n "$KRISP_LICENSE_KEY" ]; then
          sudo sed -i -e "s|^KRISP_API_KEY=.*|KRISP_API_KEY=$KRISP_LICENSE_KEY|" /etc/default/mediajam
      fi

      sudo systemctl daemon-reload
      sudo systemctl restart drachtio
      # mediajam.service reads /etc/default/mediajam via EnvironmentFile, which
      # is evaluated only when the process starts -- so the edits above take
      # effect only on an explicit restart.
      sudo systemctl restart mediajam

      # Configure telegraf to send to the monitoring server
      echo "JAMBONES_INFLUX_URL=http://$WEB_MONITORING_PRIVATE_IP:8086" | sudo tee -a /etc/default/telegraf > /dev/null
      sudo systemctl restart telegraf

      sudo -u $USER bash -c "pm2 start $HOME/apps/ecosystem.config.js"
      sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
      sudo -u $USER bash -c "pm2 save"
      sudo systemctl enable pm2-$USER.service

      echo "Feature Server setup complete!"

runcmd:
  - /tmp/configure-feature-server.sh > /var/log/jambonz-setup.log 2>&1

final_message: "jambonz Feature Server cloud-init configuration complete after $UPTIME seconds"