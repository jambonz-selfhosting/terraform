#cloud-config
# Cloud-init for Jambonz Recording Server on Exoscale

# Copy SSH keys from default user to jambonz user
bootcmd:
  - |
    set -e
    # Wait for default user home directory
    while [ ! -d /home/debian/.ssh ]; do sleep 1; done
    # Copy SSH keys to jambonz user
    if [ -d /home/debian/.ssh ] && [ -d /home/jambonz ]; then
      cp -r /home/debian/.ssh /home/jambonz/ || true
      chown -R jambonz:jambonz /home/jambonz/.ssh || true
      chmod 700 /home/jambonz/.ssh || true
      chmod 600 /home/jambonz/.ssh/authorized_keys || true
    fi

# Bring up eth1, the Exoscale private network interface.
#
# The `network:` block that used to sit here did NOTHING. cloud-init takes
# network configuration from the DATASOURCE (or /etc/cloud/cloud.cfg.d), not
# from a top-level `network:` key in cloud-config user-data. DataSourceExoscale
# supplies eth0 only, so /etc/netplan/50-cloud-init.yaml was generated with a
# single interface and eth1 stayed DOWN with no address.
#
# The damage was not subtle: with no 172.20.x.x address, redis on the
# web-monitoring host was unreachable, and every host that waits for it sat
# in `until redis-cli ... PING` -- an unbounded loop -- so cloud-init never
# finished. It also silently broke inbound/outbound call classification,
# which relies on feature-server addresses falling inside
# JAMBONES_NETWORK_CIDR.
#
# `netplan set` rather than writing YAML: this sits in an indented block
# scalar, where both a heredoc and printf-with-escapes have already produced
# broken files. netplan lives in /usr/sbin, which is not on every PATH.
  - /usr/sbin/netplan set ethernets.eth1.dhcp4=true
  - /usr/sbin/netplan set ethernets.eth1.optional=true
  - /usr/sbin/netplan apply
  # Wait for the DHCP lease before anything reads the address. drachtio's
  # ExecStartPre resolves LOCAL_IP from eth1 and FALLS BACK TO THE PUBLIC IP
  # when eth1 has none -- which makes its two contact pairs identical and
  # kills it with 'Address already in use', the exact failure the mini had.
  # Seen for real on the first boot of a medium SBC.
  - /bin/bash -c 'for i in $(seq 1 30); do ip -4 addr show eth1 | grep -q "inet " && exit 0; sleep 2; done; echo "WARNING: eth1 has no address after 60s" >&2'

write_files:
  - path: /tmp/configure-recording.sh
    permissions: '0755'
    content: |
      #!/bin/bash -xe
      # Configuration script for jambonz Recording Server

      # Variables from Terraform
      MYSQL_HOST="${mysql_host}"
      MYSQL_PORT="${mysql_port}"
      MYSQL_USER="${mysql_user}"
      MYSQL_PASSWORD="${mysql_password}"
      MYSQL_DATABASE="${mysql_database}"
      JWT_SECRET="${jwt_secret}"
      WEB_MONITORING_PRIVATE_IP="${web_monitoring_private_ip}"

      echo "Starting jambonz Recording Server configuration for Exoscale"

      USER=jambonz
      HOME=/home/jambonz

      # Get instance metadata
      echo "Getting instance metadata..."
      INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || hostname)

      echo "Instance ID: $INSTANCE_ID"

      # Configure upload_recordings service
      echo "Configuring upload_recordings service"
      sudo sed -i -e "s/MYSQL_HOST=/MYSQL_HOST=$MYSQL_HOST/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_USER=/MYSQL_USER=$MYSQL_USER/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_PASSWORD=/MYSQL_PASSWORD=$MYSQL_PASSWORD/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/MYSQL_DATABASE=/MYSQL_DATABASE=$MYSQL_DATABASE/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/BASIC_AUTH_USERNAME=/BASIC_AUTH_USERNAME=jambonz/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/BASIC_AUTH_PASSWORD=/BASIC_AUTH_PASSWORD=$JWT_SECRET/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/ENCRYPTION_SECRET=/ENCRYPTION_SECRET=$JWT_SECRET/g" /etc/systemd/system/upload_recordings.service
      sudo sed -i -e "s/--port 3017/--port 3000/g" /etc/systemd/system/upload_recordings.service

      # Insert the LD_LIBRARY_PATH environment variable into the [Service] section
      sudo sed -i '/\[Service\]/a Environment=LD_LIBRARY_PATH=\/usr\/local\/lib' /etc/systemd/system/upload_recordings.service

      sudo systemctl daemon-reload
      sudo systemctl enable upload_recordings
      sudo systemctl start upload_recordings

      # Configure telegraf to send to the monitoring server
      echo "JAMBONES_INFLUX_URL=http://$WEB_MONITORING_PRIVATE_IP:8086" | sudo tee -a /etc/default/telegraf > /dev/null
      sudo systemctl restart telegraf

      echo "Recording Server setup complete!"

runcmd:
  - /tmp/configure-recording.sh > /var/log/jambonz-setup.log 2>&1

final_message: "jambonz Recording Server cloud-init configuration complete after $UPTIME seconds"